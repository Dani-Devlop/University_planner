name: Build & Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Install + Build (Next.js standalone)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (next build → standalone)
        run: bun run build

      - name: Verify standalone server artifact
        run: |
          test -f .next/standalone/server.js
          echo "✅ standalone server.js built successfully"
